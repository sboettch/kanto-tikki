<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3ead8">
<meta name="description" content="HomeTikki KANTO — rentals on the Ningyōchō→Yokohama through-run, tuned around a 26.5-minute commute. English first, 日本語も.">
<title>HomeTikki · KANTO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛩️</text></svg>">
<link rel="stylesheet" href="kanto.css?v=r21">
<script src="kanto_i18n.js?v=r21" defer></script>
<script src="kanto_data.js?v=r21" defer></script>
<script src="kanto_corridors_data.js?v=r21" defer></script>
<script src="kanto_live.js?v=r21" defer></script>
<script src="kanto_areas.js?v=r21" defer></script>
<script src="kanto_topology.js?v=r21" defer></script>
<script src="kanto_pockets.js?v=r21" defer></script>
<script src="kanto_essence_meta.js?v=r21" defer></script>
<script src="kanto_visuals.js?v=r21" defer></script>
<script src="kanto_shadowbox.js?v=r21" defer></script>
<script src="kanto.js?v=r21" defer></script>
</head>
<body>
<header>
  <div class="brand">
    <span class="word">Home<b>Tikki</b></span>
    <span class="ja" id="brandtag">rentals</span>
  </div>
  <div class="corrpick">
    <select id="corridorpick" aria-label="Choose corridor">
      <option value="all">🌐 All Corridors · 首都圏全線</option>
      <option value="keikyu">⛩ Keikyu · 京急</option>
      <option value="toyoko">🌸 Tōyoko · 東横</option>
      <option value="hibiya">🌹 Hibiya · 日比谷</option>
      <option value="denentoshi">🌿 Den-en-toshi · 田園都市</option>
      <option value="odakyu">🗻 Odakyū · 小田急</option>
    </select>
  </div>
  <nav aria-label="Views">
    <a href="#corridor" data-v="corridor" id="navcorr">Corridor <small>沿線</small></a>
    <a href="#lines" data-v="lines" id="navlines">Lines <small>路線</small></a>
    <a href="#homes" data-v="homes" id="navhomes">Homes <small>物件</small></a>
    <a href="#pockets" data-v="pockets" id="navpockets">Pockets <small>街角</small></a>
    <a href="#radio" data-v="radio" id="navradio">Tikki Radio <small>電波</small></a>
  </nav>
  <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="search: noise · sea breeze · gyōza…" aria-label="Search">
  <div class="destbox">
    <label for="dest" id="destlabel">COMMUTE TO</label>
    <select id="dest"></select>
    <select id="goalpick" class="goalchip" aria-label="Commute boundary goal">
      <option value="26.5">goal 26.5′</option>
      <option value="40">limit 40′</option>
      <option value="60">limit 60′ (1h)</option>
    </select>
    <span class="goalchip" id="goalchip" style="display:none">goal 26.5′</span>
  </div>
  <button id="langbtn" type="button" aria-label="Switch language">日本語</button>
</header>

<main id="main" tabindex="-1"></main>

<div id="overlay" hidden></div>
<div id="toast" hidden role="status"></div>

<footer>
  <span id="foot1"></span>
  <span id="foot2"></span>
</footer>
</body>
</html>
